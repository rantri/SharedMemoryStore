name: Documentation issue
description: Report incorrect, unclear, stale, or broken documentation.
title: "Docs: "
labels:
  - documentation
body:
  - type: input
    id: affected-file
    attributes:
      label: Affected file or link
      description: Include the documentation path or link.
    validations:
      required: true
  - type: textarea
    id: observed-problem
    attributes:
      label: Observed problem
      description: Describe what is missing, incorrect, unclear, or broken.
    validations:
      required: true
  - type: textarea
    id: expected-change
    attributes:
      label: Expected change
      description: Describe the correction or clarification you expected.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include package version, command, or workflow context if relevant.
    validations:
      required: false
