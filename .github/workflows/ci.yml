name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Validate SMS2-only qualification policy
        shell: pwsh
        run: |
          ./scripts/validate-lock-free-os.ps1 -Command self-test -Configuration Release -ValidateOnly
          ./scripts/run-lock-free-qualification.ps1 -Tier pr -Configuration Release -ValidateOnly

      - name: Restore
        run: dotnet restore SharedMemoryStore.slnx

      - name: Build
        run: dotnet build SharedMemoryStore.slnx -c Release --no-restore

      - name: Verify formatting
        run: dotnet format SharedMemoryStore.slnx --verify-no-changes --no-restore

      - name: Test
        # Keep the projects sequential: individual integration scenarios retain
        # their real 8-12 process concurrency without unrelated test assemblies
        # oversubscribing the hosted runner's one-second cold-open budget.
        run: dotnet test SharedMemoryStore.slnx -c Release --no-build --maxcpucount:1

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/validate-docs.ps1

      - name: Validate SMS2 package consumption
        shell: pwsh
        run: ./scripts/validate-package-consumption.ps1 -Configuration Release

      - name: Pack
        run: dotnet pack src/SharedMemoryStore/SharedMemoryStore.csproj -c Release --no-build -o artifacts/package

  docker:
    name: Docker sharing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Validate SMS2 Docker sharing
        shell: pwsh
        run: ./scripts/validate-docker-shared-memory.ps1 -Configuration Release

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate SMS2 CMake build, tests, install, and clean consumer
        shell: pwsh
        run: ./scripts/validate-native.ps1 -Configuration Release

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Python build frontend
        run: python -m pip install --upgrade build

      - name: Validate SMS2 source tests, distributions, and clean installation
        shell: pwsh
        run: ./scripts/validate-python.ps1 -Configuration Release

  interoperability:
    name: Interoperability (${{ matrix.os }})
    needs: [native, python]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Validate all ordered SMS2 runtime pairs and stress lifecycles
        shell: pwsh
        run: >-
          ./scripts/validate-interoperability.ps1
          -Configuration Release
          -Stress
          -StressValueCount 1000
          -StressLifecycleCycleCount 10000
